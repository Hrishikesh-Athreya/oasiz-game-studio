<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Wall Jumper</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
      font-family: 'Outfit', sans-serif;
      background: #0a1a0a;
    }

    canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
    }

    .hidden {
      display: none !important;
    }

    /* Start Screen - Forest/Ninja theme */
    #start-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #0a1a0a 0%, #1a2e1a 30%, #2a3f20 60%, #1a2e1a 100%);
      z-index: 100;
      overflow: hidden;
    }

    .title-container {
      text-align: center;
      margin-bottom: 30px;
      position: relative;
      z-index: 2;
    }

    .game-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 28px;
      color: #e8d5a3;
      text-shadow: 0 0 30px rgba(232, 213, 163, 0.3), 0 3px 0 #8B6914, 0 4px 8px rgba(0,0,0,0.5);
      letter-spacing: 3px;
      margin-bottom: 16px;
      line-height: 1.4;
    }

    .game-subtitle {
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      color: rgba(168, 204, 140, 0.7);
      font-weight: 400;
      letter-spacing: 5px;
      text-transform: uppercase;
    }

    .start-btn {
      width: 200px;
      height: 56px;
      border: 2px solid rgba(232, 213, 163, 0.3);
      border-radius: 12px;
      background: linear-gradient(135deg, #4a7c2e 0%, #3a6420 100%);
      color: #e8d5a3;
      font-family: 'Press Start 2P', monospace;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(74, 124, 46, 0.4), inset 0 1px 0 rgba(255,255,255,0.1);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      text-transform: uppercase;
      letter-spacing: 3px;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      position: relative;
      z-index: 2;
    }

    .start-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(74, 124, 46, 0.5), inset 0 1px 0 rgba(255,255,255,0.15);
    }

    .start-btn:active {
      transform: translateY(1px);
      box-shadow: 0 3px 10px rgba(74, 124, 46, 0.3);
    }

    .instructions {
      margin-top: 20px;
      text-align: center;
      color: rgba(168, 204, 140, 0.4);
      font-size: 13px;
      letter-spacing: 1px;
      position: relative;
      z-index: 2;
    }

    .instructions span {
      display: block;
      margin: 6px 0;
    }

    .guide-section {
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
      justify-content: center;
      margin-top: 24px;
      position: relative;
      z-index: 2;
    }

    .guide-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .guide-item img {
      width: 200px;
      height: auto;
      border-radius: 10px;
      border: 1.5px solid rgba(232, 213, 163, 0.15);
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }

    .guide-label {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      color: rgba(232, 213, 163, 0.6);
      letter-spacing: 1px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    @media (pointer: coarse) {
      .guide-item img {
        width: 160px;
      }
      .guide-label {
        font-size: 9px;
      }
    }

    /* Bamboo decorations for start screen */
    .bamboo-deco {
      position: absolute;
      width: 8px;
      background: linear-gradient(90deg, #3a5a2a, #5a8a3a, #3a5a2a);
      border-radius: 4px;
      opacity: 0.15;
      z-index: 1;
    }

    /* HUD - Level Display */
    #hud {
      position: absolute;
      top: 45px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      pointer-events: none;
    }

    @media (pointer: coarse) {
      #hud {
        top: 120px;
      }
    }

    .level-display {
      font-family: 'Press Start 2P', monospace;
      font-size: 28px;
      color: #e8d5a3;
      text-shadow: 0 2px 6px rgba(0,0,0,0.8), 0 0 15px rgba(232,213,163,0.2);
      text-align: center;
      line-height: 1;
    }

    /* Settings Button */
    #settings-btn {
      position: absolute;
      top: 45px;
      right: 20px;
      width: 48px;
      height: 48px;
      border: 2px solid rgba(232, 213, 163, 0.2);
      border-radius: 12px;
      background: rgba(10, 26, 10, 0.7);
      backdrop-filter: blur(10px);
      cursor: pointer;
      z-index: 55;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, background 0.15s ease;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    @media (pointer: coarse) {
      #settings-btn {
        top: 120px;
      }
    }

    #settings-btn:hover {
      background: rgba(10, 26, 10, 0.9);
      transform: scale(1.05);
    }

    #settings-btn:active {
      transform: scale(0.95);
    }

    .gear-icon {
      width: 22px;
      height: 22px;
      fill: #e8d5a3;
      pointer-events: none;
    }

    /* Settings Modal */
    #settings-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 15, 5, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }

    #settings-modal.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .settings-panel {
      background: linear-gradient(135deg, #1a2e1a 0%, #0f1f0f 100%);
      border-radius: 16px;
      padding: 28px 24px;
      min-width: 280px;
      max-width: 320px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(168, 204, 140, 0.15);
    }

    .settings-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 16px;
      color: #e8d5a3;
      text-align: center;
      margin-bottom: 24px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.4);
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid rgba(168, 204, 140, 0.1);
    }

    .setting-row:last-of-type {
      border-bottom: none;
    }

    .setting-label {
      display: flex;
      align-items: center;
      gap: 12px;
      color: rgba(232, 213, 163, 0.9);
      font-size: 16px;
      font-weight: 500;
    }

    .setting-icon {
      width: 22px;
      height: 22px;
      fill: #a8cc8c;
      pointer-events: none;
    }

    .toggle-switch {
      width: 52px;
      height: 30px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 15px;
      position: relative;
      cursor: pointer;
      transition: background 0.2s ease;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .toggle-switch.active {
      background: linear-gradient(135deg, #4a7c2e 0%, #3a6420 100%);
      border-color: rgba(168, 204, 140, 0.3);
    }

    .toggle-knob {
      width: 24px;
      height: 24px;
      background: #e8d5a3;
      border-radius: 50%;
      position: absolute;
      top: 3px;
      left: 3px;
      transition: transform 0.2s ease;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
    }

    .toggle-switch.active .toggle-knob {
      transform: translateX(22px);
    }

    .close-settings {
      width: 100%;
      height: 46px;
      margin-top: 20px;
      border: 1px solid rgba(232, 213, 163, 0.2);
      border-radius: 12px;
      background: rgba(232, 213, 163, 0.08);
      color: #e8d5a3;
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      letter-spacing: 2px;
      cursor: pointer;
      transition: background 0.15s ease;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .close-settings:hover {
      background: rgba(232, 213, 163, 0.15);
    }

    /* Game Over Overlay */
    #game-over {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 15, 5, 0.9);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 150;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    #game-over.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .game-over-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 24px;
      color: #c0392b;
      text-shadow: 0 0 20px rgba(192, 57, 43, 0.4), 0 3px 0 #7f2318;
      margin-bottom: 30px;
      letter-spacing: 2px;
    }

    .final-score-label {
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      color: rgba(168, 204, 140, 0.6);
      text-transform: uppercase;
      letter-spacing: 4px;
      margin-bottom: 8px;
    }

    .final-score-value {
      font-family: 'Press Start 2P', monospace;
      font-size: 56px;
      color: #e8d5a3;
      text-shadow: 0 0 30px rgba(232, 213, 163, 0.3), 0 3px 0 #8B6914;
      margin-bottom: 40px;
    }

    .restart-btn {
      width: 220px;
      height: 56px;
      border: 2px solid rgba(232, 213, 163, 0.3);
      border-radius: 12px;
      background: linear-gradient(135deg, #4a7c2e 0%, #3a6420 100%);
      color: #e8d5a3;
      font-family: 'Press Start 2P', monospace;
      font-size: 12px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(74, 124, 46, 0.4);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      text-transform: uppercase;
      letter-spacing: 2px;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .restart-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(74, 124, 46, 0.5);
    }

    .restart-btn:active {
      transform: translateY(1px);
    }

    /* Pause Button */
    #pause-btn {
      position: absolute;
      top: 45px;
      left: 20px;
      width: 48px;
      height: 48px;
      border: 2px solid rgba(232, 213, 163, 0.2);
      border-radius: 12px;
      background: rgba(10, 26, 10, 0.7);
      backdrop-filter: blur(10px);
      cursor: pointer;
      z-index: 55;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, background 0.15s ease;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    @media (pointer: coarse) {
      #pause-btn {
        top: 120px;
      }
    }

    #pause-btn:hover {
      background: rgba(10, 26, 10, 0.9);
      transform: scale(1.05);
    }

    #pause-btn:active {
      transform: scale(0.95);
    }

    .pause-icon {
      width: 22px;
      height: 22px;
      fill: #e8d5a3;
      pointer-events: none;
    }

    /* Pause Overlay */
    #pause-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 15, 5, 0.8);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 160;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.2s ease, visibility 0.2s ease;
    }

    #pause-overlay.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .pause-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 24px;
      color: #e8d5a3;
      text-shadow: 0 0 20px rgba(232, 213, 163, 0.3), 0 3px 0 #8B6914;
      margin-bottom: 40px;
      letter-spacing: 2px;
    }

    .resume-btn {
      width: 220px;
      height: 56px;
      border: 2px solid rgba(232, 213, 163, 0.3);
      border-radius: 12px;
      background: linear-gradient(135deg, #4a7c2e 0%, #3a6420 100%);
      color: #e8d5a3;
      font-family: 'Press Start 2P', monospace;
      font-size: 12px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(74, 124, 46, 0.4);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      text-transform: uppercase;
      letter-spacing: 2px;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .resume-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(74, 124, 46, 0.5);
    }

    .resume-btn:active {
      transform: translateY(1px);
    }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <!-- Start Screen -->
  <div id="start-screen">
    <div class="title-container">
      <h1 class="game-title">WALL JUMPER</h1>
      <p class="game-subtitle">Climb as high as you can</p>
    </div>
    <button class="start-btn" id="start-btn">PLAY</button>
    <div class="guide-section">
      <div class="guide-item">
        <img src="/assets/jump_guide.png" alt="Jump guide">
        <span class="guide-label">Tap to Jump</span>
      </div>
      <div class="guide-item">
        <img src="/assets/backflip_guide.png" alt="Backflip guide">
        <span class="guide-label">Tap for Backflip</span>
      </div>
    </div>
    <div class="instructions">
      <span>Tap anywhere to perform each move</span>
    </div>
  </div>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div class="level-display" id="level-value">0</div>
  </div>

  <!-- Pause Button -->
  <button id="pause-btn" class="hidden">
    <svg class="pause-icon" viewBox="0 0 24 24">
      <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
    </svg>
  </button>

  <!-- Settings Button -->
  <button id="settings-btn" class="hidden">
    <svg class="gear-icon" viewBox="0 0 24 24">
      <path d="M12 15.5A3.5 3.5 0 0 1 8.5 12 3.5 3.5 0 0 1 12 8.5a3.5 3.5 0 0 1 3.5 3.5 3.5 3.5 0 0 1-3.5 3.5m7.43-2.53c.04-.32.07-.64.07-.97 0-.33-.03-.66-.07-1l2.11-1.63c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.31-.61-.22l-2.49 1c-.52-.39-1.06-.73-1.69-.98l-.37-2.65A.506.506 0 0 0 14 2h-4c-.25 0-.46.18-.5.42l-.37 2.65c-.63.25-1.17.59-1.69.98l-2.49-1c-.22-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64L4.57 11c-.04.34-.07.67-.07 1 0 .33.03.65.07.97l-2.11 1.66c-.19.15-.25.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1.01c.52.4 1.06.74 1.69.99l.37 2.65c.04.24.25.42.5.42h4c.25 0 .46-.18.5-.42l.37-2.65c.63-.26 1.17-.59 1.69-.99l2.49 1.01c.22.08.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.66Z"/>
    </svg>
  </button>

  <!-- Settings Modal -->
  <div id="settings-modal">
    <div class="settings-panel">
      <h2 class="settings-title">Settings</h2>
      <div class="setting-row">
        <div class="setting-label">
          <svg class="setting-icon" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55C7.79 13 6 14.79 6 17s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
          <span>Music</span>
        </div>
        <div class="toggle-switch active" id="toggle-music" data-setting="music">
          <div class="toggle-knob"></div>
        </div>
      </div>
      <div class="setting-row">
        <div class="setting-label">
          <svg class="setting-icon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
          <span>Sound FX</span>
        </div>
        <div class="toggle-switch active" id="toggle-fx" data-setting="fx">
          <div class="toggle-knob"></div>
        </div>
      </div>
      <div class="setting-row">
        <div class="setting-label">
          <svg class="setting-icon" viewBox="0 0 24 24"><path d="M0 15h2V9H0v6zm4 2h2V7H4v10zm4 3h2V4H8v16zm4-3h2V7h-2v10zm4-2h2V9h-2v6zm4-6v6h2V9h-2z"/></svg>
          <span>Haptics</span>
        </div>
        <div class="toggle-switch active" id="toggle-haptics" data-setting="haptics">
          <div class="toggle-knob"></div>
        </div>
      </div>
      <button class="close-settings" id="close-settings">Done</button>
    </div>
  </div>

  <!-- Pause Overlay -->
  <div id="pause-overlay">
    <h2 class="pause-title">PAUSED</h2>
    <button class="resume-btn" id="resume-btn">RESUME</button>
  </div>

  <!-- Game Over Overlay -->
  <div id="game-over">
    <h2 class="game-over-title">GAME OVER</h2>
    <p class="final-score-label">Level Reached</p>
    <p class="final-score-value" id="final-score">0</p>
    <button class="restart-btn" id="restart-btn">PLAY AGAIN</button>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
