<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unicycle Hero</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
            touch-action: none;
            background: #000;
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        
        .hidden {
            visibility: hidden;
        }
        
        #settingsBtn {
            position: absolute;
            top: 45px;
            right: 20px;
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            pointer-events: auto;
            transition: all 0.2s;
        }
        
        #settingsBtn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }
        
        #settingsBtn::before {
            content: "⚙️";
            font-size: 20px;
        }
        
        @media (pointer: coarse) {
            #settingsBtn {
                top: 120px;
            }
        }
        
        #settingsModal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            padding: 30px;
            min-width: 300px;
            pointer-events: auto;
            visibility: hidden;
        }
        
        #settingsModal.show {
            visibility: visible;
        }
        
        .setting-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 15px 0;
            color: white;
            font-size: 16px;
        }
        
        .toggle {
            width: 50px;
            height: 25px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            position: relative;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .toggle.active {
            background: #4CAF50;
        }
        
        .toggle::after {
            content: '';
            position: absolute;
            width: 21px;
            height: 21px;
            background: white;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: transform 0.3s;
        }
        
        .toggle.active::after {
            transform: translateX(25px);
        }
        
        #startScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            pointer-events: auto;
        }
        
        #startScreen h1 {
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        #startScreen button {
            padding: 15px 30px;
            font-size: 20px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            border-radius: 30px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        #startScreen button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }
        
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            pointer-events: none;
        }
        
        .mobile-only {
            display: none;
        }
        
        @media (pointer: coarse) {
            .mobile-only {
                display: block;
            }
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div class="overlay">
        <button id="settingsBtn"></button>
        
        <div id="settingsModal">
            <h2 style="color: white; margin-top: 0;">Settings</h2>
            <div class="setting-item">
                <span>🎵 Music</span>
                <div class="toggle" id="musicToggle"></div>
            </div>
            <div class="setting-item">
                <span>🔊 FX</span>
                <div class="toggle" id="fxToggle"></div>
            </div>
            <div class="setting-item">
                <span>📳 Haptics</span>
                <div class="toggle" id="hapticsToggle"></div>
            </div>
        </div>
        
        <div id="startScreen">
            <h1>Unicycle Hero</h1>
            <button id="playBtn">Play</button>
        </div>
        
        <div id="hud" class="hidden">
            <div>Score: <span id="score">0</span></div>
        </div>
        
        <div class="mobile-only" style="position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); color: white; text-align: center;">
            <div style="display: flex; gap: 20px; justify-content: center; margin-bottom: 10px;">
                <button id="leftBtn" style="width: 60px; height: 60px; background: rgba(255, 255, 255, 0.2); border: 2px solid white; border-radius: 50%; color: white; font-size: 20px; cursor: pointer;">←</button>
                <button id="rightBtn" style="width: 60px; height: 60px; background: rgba(255, 255, 255, 0.2); border: 2px solid white; border-radius: 50%; color: white; font-size: 20px; cursor: pointer;">→</button>
            </div>
            <div style="font-size: 12px;">Touch controls</div>
        </div>
    </div>
    
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
